<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Letterboxd - Album</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        /* Navigation */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px 20px;
            background: #764ba2;
            color: white;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .home-button {
            padding: 10px 15px;
            background: #444;
            border-radius: 5px;
            color: white;
            text-decoration: none;
        }

        .home-button:hover {
            background: #333;
        }

        .website-title {
            margin: 0;
            font-size: 22px;
            white-space: nowrap;
        }

        /* Search bar */
        .top-search {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            max-width: 500px;
            margin-left: auto;
        }

        .top-search input {
            width: 100%;
            min-width: 0;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font: inherit;
        }

        .top-search button,
        .write-review-button,
        .submit-review-button {
            padding: 11px 15px;
            border: 0;
            border-radius: 6px;
            background: #444;
            color: white;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }

        .top-search button:hover {
            background: #333;
        }

        .profile-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 2px solid white;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Search results */
        .search-results-section {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        #searchStatus {
            margin: 12px 0;
            color: #666;
        }

        #albumResults {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .album-result {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000012;
            overflow-wrap: anywhere;
        }

        .album-result img,
        .album-cover-placeholder {
            width: 90px;
            height: 90px;
            flex: 0 0 90px;
            object-fit: cover;
            background: #eee;
            border-radius: 4px;
        }

        .album-result h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .album-result p {
            margin: 4px 0;
            color: #666;
            font-size: 14px;
        }

        .album-result a {
            display: inline-block;
            margin-top: 8px;
            color: #764ba2;
        }

        .album-result button {
            margin-top: 8px;
            padding: 7px 10px;
            border: 0;
            border-radius: 5px;
            background: #764ba2;
            color: white;
            cursor: pointer;
        }

        .album-result button:hover {
            background: #5a377d;
        }

        /* Album details */
        .album-container {
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr);
            gap: 30px;
            max-width: 1000px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000014;
        }

        .album-image {
            width: 180px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            background: #eee;
        }

        .album-info h2,
        .reviews-header h2 {
            color: #764ba2;
        }

        .album-info p {
            color: #555;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .reviews {
            grid-column: 1 / -1;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .reviews-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .write-review-button,
        .submit-review-button {
            background: #764ba2;
        }

        .write-review-button:hover,
        .submit-review-button:hover {
            background: #5a377d;
        }

        .review {
            padding: 15px;
            margin: 15px 0;
            background: #f8f5fc;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .review-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .review h3 {
            margin: 0;
            font-size: 14px;
            color: #444;
        }

        .review-rating {
            color: #764ba2;
            font-size: 16px;
        }

        .review-date {
            margin-top: 10px;
            color: #777;
            font-size: 13px;
        }

        #noReviews {
            color: #777;
            font-style: italic;
        }

        /* Review popup */
        .review-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0009;
        }

        .review-backdrop[hidden] {
            display: none;
        }

        .review-modal {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
        }

        .review-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
        }

        .review-modal-header h2 {
            margin: 0;
            color: #764ba2;
        }

        .close-button {
            border: 0;
            background: none;
            color: #666;
            font-size: 30px;
            cursor: pointer;
        }

        .review-form {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .star-rating {
            display: flex;
            gap: 5px;
        }

        .star-rating button {
            border: 0;
            padding: 0;
            background: none;
            color: #ccc;
            font-size: 36px;
            cursor: pointer;
        }

        .star-rating button.selected {
            color: #764ba2;
        }

        .rating-hint {
            margin-top: 6px;
            color: #777;
            font-size: 13px;
        }

        .review-form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .cancel-button {
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            background: #eee;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .top-bar {
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px;
            }

            .nav-left {
                gap: 10px;
                flex: 1;
                min-width: 0;
            }

            .website-title {
                font-size: 18px;
                white-space: normal;
            }

            .profile-link {
                width: 42px;
                height: 42px;
            }

            .top-search {
                order: 3;
                flex-basis: 100%;
                max-width: none;
                margin-left: 0;
            }

            .search-results-section {
                margin: 12px;
                padding: 10px;
            }

            .album-container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 20px 12px;
                padding: 20px;
            }

            .reviews {
                grid-column: 1;
            }

            .review-form,
            .review-modal-header {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation bar -->
    <header class="top-bar">
        <div class="nav-left">
            <a href="index.html" class="home-button">Home</a>
            <h1 class="website-title">Music Letterboxd</h1>
        </div>

        <form class="top-search" id="topSearchForm">
            <input
                type="search"
                id="topSearchInput"
                placeholder="Search albums or artists..."
                aria-label="Search albums or artists"
                required
            >
            <button type="submit">Search</button>
        </form>

        <a href="Settings_page.html"
           class="profile-link"
           aria-label="Open settings">
            <img
                src="Images/default-icon.png"
                alt="Profile"
                class="profile-icon"
            >
        </a>
    </header>

    <!-- Search results appear here -->
    <section
        class="search-results-section"
        id="searchResultsSection"
        hidden
        aria-label="Album search results"
    >
        <h2>Search Results</h2>
        <p id="searchStatus" role="status" aria-live="polite"></p>
        <div id="albumResults"></div>
    </section>

    <!-- Album information -->
    <main class="album-container">

        <aside>
            <img
                id="albumImage"
                class="album-image"
                src="https://placehold.co/360x440/764ba2/ffffff?text=Album+Cover"
                alt="Album cover"
            >
        </aside>

        <section class="album-info">
            <h2 id="albumTitle">Album Name</h2>

            <p>
                <strong>Artist:</strong>
                <span id="albumArtist">Artist name</span>
            </p>

            <p>
                <strong>Release Date:</strong>
                <span id="albumReleaseDate">N/A</span>
            </p>

            <p>
                <strong>Genre:</strong>
                <span id="albumGenre">N/A</span>
            </p>

            <h3>Album Information</h3>
            <p id="albumDescription">Description for album.</p>
        </section>

        <!-- Reviews -->
        <section class="reviews">
            <div class="reviews-header">
                <h2>Reviews</h2>

                <button
                    type="button"
                    class="write-review-button"
                    id="openReviewButton"
                >
                    + Write a Review
                </button>
            </div>

            <div id="reviewList" aria-live="polite">
                <p id="noReviews">
                    No reviews yet. Be the first!
                </p>
            </div>
        </section>

    </main>

    <!-- Review popup -->
    <div class="review-backdrop" id="reviewBackdrop" hidden>
        <section
            class="review-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="reviewModalTitle"
        >
            <header class="review-modal-header">
                <h2 id="reviewModalTitle">Write a Review</h2>

                <button
                    type="button"
                    class="close-button"
                    id="closeReviewButton"
                    aria-label="Close"
                >&times;</button>
            </header>

            <form class="review-form" id="reviewForm">

                <div class="form-group">
                    <label for="reviewUsername">Your Username</label>
                    <input
                        type="text"
                        id="reviewUsername"
                        placeholder="Enter your username"
                        maxlength="60"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Your Rating</label>

                    <div
                        class="star-rating"
                        id="starRating"
                        role="group"
                        aria-label="Choose a rating"
                    >
                        <button type="button" data-rating="1"
                            aria-label="1 star" aria-pressed="false">★</button>
                        <button type="button" data-rating="2"
                            aria-label="2 stars" aria-pressed="false">★</button>
                        <button type="button" data-rating="3"
                            aria-label="3 stars" aria-pressed="false">★</button>
                        <button type="button" data-rating="4"
                            aria-label="4 stars" aria-pressed="false">★</button>
                        <button type="button" data-rating="5"
                            aria-label="5 stars" aria-pressed="false">★</button>
                    </div>

                    <div class="rating-hint" id="ratingHint">
                        Select a rating from 1 to 5 stars.
                    </div>
                </div>

                <div class="form-group">
                    <label for="reviewText">Your Review</label>
                    <textarea
                        id="reviewText"
                        maxlength="5000"
                        placeholder="What did you think of this album?"
                        required
                    ></textarea>
                </div>

                <footer class="review-form-footer">
                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelReviewButton"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="submit-review-button">
                        Submit Review
                    </button>
                </footer>

            </form>
        </section>
    </div>

<script>
    // Page elements
    const searchForm = document.getElementById('topSearchForm');
    const searchInput = document.getElementById('topSearchInput');
    const resultsSection = document.getElementById('searchResultsSection');
    const searchStatus = document.getElementById('searchStatus');
    const albumResults = document.getElementById('albumResults');

    const reviewForm = document.getElementById('reviewForm');
    const reviewList = document.getElementById('reviewList');
    const backdrop = document.getElementById('reviewBackdrop');

    const openButton = document.getElementById('openReviewButton');
    const closeButton = document.getElementById('closeReviewButton');
    const cancelButton = document.getElementById('cancelReviewButton');

    const starButtons = document.querySelectorAll('#starRating button');
    const ratingHint = document.getElementById('ratingHint');

    let selectedRating = 0;
    let searchController = null;

    // Show album details on this page.
    function displayAlbum(album) {
        document.getElementById('albumTitle').textContent =
            album.title || 'Unknown album';

        document.getElementById('albumArtist').textContent =
            album.artist || 'Unknown artist';

        document.getElementById('albumReleaseDate').textContent =
            album.release_year || 'Unknown';

        document.getElementById('albumGenre').textContent =
            album.genre || 'Unknown';

        document.getElementById('albumDescription').textContent =
            album.description || 'No album information available.';

        const cover = document.getElementById('albumImage');

        cover.src = album.album_cover_url ||
            'https://placehold.co/360x440/764ba2/ffffff?text=Album+Cover';

        cover.alt = (album.title || 'Album') + ' cover';

        // Remember the selected album for the detail page.
        sessionStorage.setItem('selectedAlbum', JSON.stringify(album));

        // Clear the existing page reviews when changing albums.
        // The review list itself is not saved to the server by this code.
        reviewList.innerHTML =
            '<p id="noReviews">No reviews yet. Be the first!</p>';

        resultsSection.hidden = true;

        document.querySelector('.album-container').scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }

    // Create a search-result card safely.
    function createAlbumCard(album) {
        const card = document.createElement('article');
        card.className = 'album-result';

        const cover = album.album_cover_url
            ? document.createElement('img')
            : document.createElement('div');

        if (album.album_cover_url) {
            cover.src = album.album_cover_url;
            cover.alt = (album.title || 'Album') + ' cover';
            cover.loading = 'lazy';
        } else {
            cover.className = 'album-cover-placeholder';
        }

        const details = document.createElement('div');

        const title = document.createElement('h3');
        title.textContent = album.title || 'Unknown album';

        const artist = document.createElement('p');
        artist.textContent = album.artist || 'Unknown artist';

        const year = document.createElement('p');
        year.textContent = album.release_year || 'Unknown year';

        const selectButton = document.createElement('button');
        selectButton.type = 'button';
        selectButton.textContent = 'View Album';

        selectButton.addEventListener('click', function () {
            displayAlbum(album);
        });

        details.append(title, artist, year);

        if (album.spotify_url) {
            const spotifyLink = document.createElement('a');

            spotifyLink.href = album.spotify_url;
            spotifyLink.target = '_blank';
            spotifyLink.rel = 'noopener noreferrer';
            spotifyLink.textContent = 'Open in Spotify';

            details.appendChild(spotifyLink);
            details.appendChild(document.createElement('br'));
        }

        details.appendChild(selectButton);
        card.append(cover, details);

        // Clicking the card itself also selects the album.
        card.style.cursor = 'pointer';

        card.addEventListener('click', function (event) {
            if (event.target.closest('a, button')) {
                return;
            }

            displayAlbum(album);
        });

        return card;
    }

    // Search the same API used on the home/login page.
    async function searchAlbums(query) {
        query = query.trim();

        if (!query) {
            return;
        }

        // Cancel an older search if the user starts another.
        if (searchController) {
            searchController.abort();
        }

        searchController = new AbortController();

        resultsSection.hidden = false;
        searchStatus.textContent = 'Searching...';
        albumResults.replaceChildren();

        // Put the search term in the URL so searches can be shared.
        const url = new URL(window.location.href);
        url.searchParams.set('q', query);
        history.replaceState({}, '', url);

        try {
            const response = await fetch(
                '/api/albums?q=' + encodeURIComponent(query),
                {
                    signal: searchController.signal,
                    headers: {
                        'Accept': 'application/json'
                    }
                }
            );

            // Handle expired login sessions and server errors.
            if (response.status === 401 || response.status === 403) {
                throw new Error(
                    'Your session may have expired. Please sign in again.'
                );
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Album search failed.');
            }

            if (!Array.isArray(data.albums)) {
                throw new Error(
                    'The server returned an unexpected response. Expected an albums array.'
                );
            }

            if (data.albums.length === 0) {
                searchStatus.textContent =
                    'No albums found. Try another album or artist.';
                return;
            }

            searchStatus.textContent =
                'Found ' + data.albums.length + ' album(s).';

            data.albums.forEach(function (album) {
                albumResults.appendChild(createAlbumCard(album));
            });

        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }

            console.error('Album search error:', error);

            searchStatus.textContent = error.message ||
                'Could not search for albums. Check your server connection.';
        }
    }

    // Search form submission.
    searchForm.addEventListener('submit', function (event) {
        event.preventDefault();
        searchAlbums(searchInput.value);
    });

    // Load the album selected on the previous page.
    try {
        const savedAlbum = sessionStorage.getItem('selectedAlbum');

        if (savedAlbum) {
            displayAlbum(JSON.parse(savedAlbum));
        }
    } catch (error) {
        console.error('Could not load the saved album:', error);
    }

    // Automatically search if the page URL contains ?q=...
    const initialQuery =
        new URLSearchParams(window.location.search).get('q');

    if (initialQuery) {
        searchInput.value = initialQuery;
        searchAlbums(initialQuery);
    }
</script>

<script>
    // Open the review popup.
    function openPopup() {
        reviewForm.reset();
        setRating(0);
        backdrop.hidden = false;

        document.getElementById('reviewUsername').focus();
    }

    // Close the popup.
    function closePopup() {
        backdrop.hidden = true;
        openButton.focus();
    }

    openButton.addEventListener('click', openPopup);
    closeButton.addEventListener('click', closePopup);
    cancelButton.addEventListener('click', closePopup);

    // Close when the user clicks the dark background.
    backdrop.addEventListener('click', function (event) {
        if (event.target === backdrop) {
            closePopup();
        }
    });

    // Close when Escape is pressed.
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !backdrop.hidden) {
            closePopup();
        }
    });

    // Update the selected star rating.
    function setRating(rating) {
        selectedRating = rating;

        starButtons.forEach(function (button) {
            const value = Number(button.dataset.rating);

            button.classList.toggle('selected', value <= rating);
            button.setAttribute(
                'aria-pressed',
                String(value === rating)
            );
        });

        ratingHint.textContent = rating === 0
            ? 'Select a rating from 1 to 5 stars.'
            : rating + (rating === 1
                ? ' star selected.'
                : ' stars selected.');
    }

    // Handle star clicks.
    starButtons.forEach(function (button) {
        button.addEventListener('click', function () {
            setRating(Number(button.dataset.rating));
        });
    });

    // Submit and display the review.
    reviewForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document
            .getElementById('reviewUsername')
            .value.trim();

        const reviewText = document
            .getElementById('reviewText')
            .value.trim();

        if (!username) {
            document.getElementById('reviewUsername').focus();
            return;
        }

        if (!reviewText) {
            document.getElementById('reviewText').focus();
            return;
        }

        if (selectedRating === 0) {
            ratingHint.textContent =
                'Please select a rating before submitting.';
            return;
        }

        // Remove the empty-state message.
        const emptyMessage = document.getElementById('noReviews');

        if (emptyMessage) {
            emptyMessage.remove();
        }

        // Create the review card.
        const card = document.createElement('article');
        card.className = 'review';

        const header = document.createElement('div');
        header.className = 'review-header';

        const name = document.createElement('h3');
        name.textContent = username;

        const rating = document.createElement('div');
        rating.className = 'review-rating';
        rating.textContent =
            '★'.repeat(selectedRating) +
            '☆'.repeat(5 - selectedRating);

        header.append(name, rating);

        const content = document.createElement('p');
        content.textContent = reviewText;

        const date = document.createElement('div');
        date.className = 'review-date';
        date.textContent = new Date().toLocaleDateString(
            undefined,
            {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            }
        );

        card.append(header, content, date);
        reviewList.appendChild(card);

        reviewForm.reset();
        setRating(0);
        closePopup();
    });
</script>

</body>
</html>
