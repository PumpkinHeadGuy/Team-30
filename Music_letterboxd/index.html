
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Login Page</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #764ba2;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a377d;
        }

        .error-message {
            color: #de3e3e;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        .success-box {
            display: none;
        }

        .create-account {
            margin-top: 15px;
        }

        .create-account button {
            background: none;
            border: none;
            color: #764ba2;
            cursor: pointer;
            font-size: 14px;
        }

        .album-page {
            display: none;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            padding: 40px 24px;
            background: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .album-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .album-search,
        #albumResults {
            width: 100%;
        }

        .album-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .album-header h1 {
            margin: 0;
            color: #333;
            font-size: 28px;
        }

        .album-header button {
            border: none;
            color: #764ba2;
            background: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .album-search {
            padding: 28px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
        }

        .album-search h2 {
            margin-top: 0;
            color: #333;
        }

        .album-search form {
            display: flex;
            gap: 10px;
        }

        .album-search input {
            flex: 1;
        }

        .album-search .btn {
            width: auto;
            white-space: nowrap;
        }

        #searchStatus {
            min-height: 20px;
            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }

        #albumResults {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .album-result {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 6px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .album-result img,
        .album-cover-placeholder {
            width: 80px;
            height: 80px;
            flex: 0 0 80px;
            object-fit: cover;
            background: #ddd;
        }

        .album-result h3 { margin: 0 0 6px; color: #333; font-size: 16px; }
        .album-result p { margin: 3px 0; color: #666; font-size: 14px; }
        .album-result a { color: #764ba2; font-size: 13px; }

        @media (max-width: 600px) {
            .album-header { align-items: flex-start; gap: 16px; }
            .album-search form { flex-direction: column; }
            .album-search .btn { width: 100%; }
        }

        /* Review popup: backdrop and dialog */
        #reviewBackdrop[hidden] {
            display: none;
        }

        .review-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, .55);
        }

        .review-modal {
            width: min(900px, 100%);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            border-radius: 8px;
            color: #333;
            background: #ffffff;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #eee;
        }

        .review-header h2 {
            margin: 0;
            color: #333;
        }

        /* Review popup: album details and form controls */
        .review-content {
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr);
            gap: 32px;
            padding: 32px;
        }

        .review-cover {
            width: 180px;
            height: 180px;
            background: #ddd;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        .review-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .review-cover span {
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            color: #666;
            font-size: 56px;
        }
        #reviewCoverPlaceholder[hidden] {
            display: none;
        }

        .review-details {
            min-width: 0;
            display: grid;
            gap: 12px;
        }

        .review-details h3 {
            margin: 0px;
            color: #333;
            font-size: 26px;
        }

        .review-details p {
            margin: 0px;
            color: #666;
        }

        .review-details input,
        .review-details textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        .review-details textarea {
            min-height: 140px;
            color: #333;
            background: #fff;
            resize: vertical;
        }

        .review-options {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }

        .rating-control span,
        .like-control span {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: bold;
        }

        .star-rating {
            display: flex;
            gap: 2px;
        }

        .rating-control {
            position: relative;
        }

        .clear-rating {
            position: absolute;
            left: -28px;
            top: 40px;
        }

        .star-rating button,
        #reviewHeart {
            border: 0;
            background: none;
            color: #ccc;
            font-size: 38px;
            line-height: 1;
            cursor: pointer;
        }
        
        .star-rating button.clear-rating {
            font-size: 25px;
        }

        /* Review popup: footer and selected controls */
        .review-footer {
            display: flex;
            justify-content: flex-end;
            padding: 16px 32px;
            border-top: 1px solid #eee;
            background: #f4f4f4;
        }

        #saveReviewButton {
            padding: 10px 24px;
            border: 0;
            border-radius: 24px;
            color: white;
            background: #764ba2;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #saveReviewButton:hover {
            background: #5a377d;
        }

        #reviewHeart[aria-pressed="true"],
        .star-rating button[aria-pressed="true"] {
            color: #764ba2;
        }
        .star-rating button:not(.clear-rating) {
            background-image: linear-gradient(
                90deg,
                #764ba2 var(--star-fill, 0%),
                #ccc var(--star-fill, 0%)
            );
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 600px) {
            .review-content {
                grid-template-columns: 80px minmax(0, 1fr);
                gap: 16px;
                padding: 20px 16px;
            }

            .review-cover {
                width: 80px;
                height: 80px;
            }

            .star-rating button,
            #reviewHeart {
                font-size: 30px;
            }
        }

    </style>

</head>

<body>

    <div class="login-card" id="loginCard">

        <h2>Sign In</h2>

        <form id="loginForm">

            <div class="input-group">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="btn">Login</button>

        </form>

        <div class="create-account">

            <button onclick="showCreateAccount()">
                Create Account
            </button>

        </div>

        <div class="error-message" id="errorMessage"></div>

    </div>


    <div
        class="login-card"
        id="createAccountCard"
        style="display: none;"
    >

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="input-group">

                <label for="registerUsername">Username</label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <div class="create-account">

            <button onclick="showLogin()">
                Back to Login
            </button>

        </div>

        <div class="error-message" id="registerError"></div>

    </div>


    <div class="login-card success-box" id="dashboardCard">

        <h2>Welcome Back!</h2>

        <p>You have successfully logged in.</p>

        <button class="btn" onclick="logout()">Logout</button>

    </div>


    <div class="album-page" id="albumPage">

        <div class="album-container">
            <div class="album-header">
                <h1>Music Letterboxd</h1>
                <button type="button" onclick="logout()">Logout</button>
            </div>

            <div class="album-search">
                <h2>Search for an album</h2>

                <form id="albumSearchForm">
                    <input
                        type="search"
                        id="albumQuery"
                        placeholder="Enter an album or artist"
                        required
                    >
                    <button type="submit" class="btn">Search</button>
                </form>

                <div id="searchStatus"></div>
            </div>

            <div id="albumResults"></div>

            <div class="review-backdrop" id="reviewBackdrop" hidden>

                <section class="review-modal" role="dialog" aria-modal="true"
                    aria-labelledby="reviewModalTitle">

                    <header class="review-header">

                        <h2 id="reviewModalTitle">I listened to...</h2>

                        <button
                            type="button"
                            id="closeReviewButton"
                            aria-label="Close review"
                        >
                            &times;
                        </button>

                    </header>

                    <div class="review-content">

                        <div class="review-cover">
                            <img id="reviewAlbumCover" alt="" hidden>
                            <span id="reviewCoverPlaceholder" aria-hidden="true">♪</span>
                        </div>

                        <div class="review-details">

                            <h3 id="reviewAlbumTitle">Album title</h3>
                            <p id="reviewAlbumArtist">Artist name</p>
                            <p id="reviewAlbumYear">Release year</p>

                            <label for="listenedAt">Listened on</label>
                            <input type="date" id="listenedAt">

                            <label for="reviewText">Review (optional)</label>

                            <textarea
                                id="reviewText"
                                maxlength="5000"
                                placeholder="Add a review"
                            ></textarea>

                            <div class="review-options">

                                <div class="rating-control">
                                    <span>Rating</span>

                                    <div class="star-rating">
                                        <button type="button" class="clear-rating" data-star="0" aria-label="0 star" hidden>✖</button>
                                        <button type="button" data-star="1" aria-label="1 star">★</button>
                                        <button type="button" data-star="2" aria-label="2 star">★</button>
                                        <button type="button" data-star="3" aria-label="3 star">★</button>
                                        <button type="button" data-star="4" aria-label="4 star">★</button>
                                        <button type="button" data-star="5" aria-label="5 star">★</button>
                                    </div>
                                </div>

                                <div class="like-control">
                                    <span>Like</span>
                                    <button type="button" id="reviewHeart" aria-pressed="false">♥</button>
                                </div>

                            </div>

                        </div>

                    </div>

                    <footer class="review-footer">
                        <button type="button" id="saveReviewButton">Save</button>
                    </footer>

                </section>

            </div>
        </div>

    </div>


    <script>

        const loginForm = document.getElementById('loginForm');

        const errorMessage = document.getElementById('errorMessage');

        const loginCard = document.getElementById('loginCard');

        const dashboardCard =
            document.getElementById('dashboardCard');

        const albumPage =
            document.getElementById('albumPage');

        const createAccountCard =
            document.getElementById('createAccountCard');

        let selectedRating = 0;

        loginForm.addEventListener('submit', async function(event) {

            event.preventDefault();

            const username =
                document.getElementById('username').value;

            const password =
                document.getElementById('password').value;

            try {

                const response = await fetch('/login', {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded'
                    },

                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })

                });

                if (response.ok) {

                    errorMessage.innerText = '';

                    loginCard.style.display = 'none';

                    showAlbumPage();

                } else {

                    errorMessage.innerText =
                        'Invalid username or password!';

                }

            } catch (error) {

                errorMessage.innerText =
                    'Could not connect to server.';

            }

        });


        function showCreateAccount() {

            loginCard.style.display = 'none';

            createAccountCard.style.display = 'block';

        }


        function showLogin() {

            createAccountCard.style.display = 'none';

            loginCard.style.display = 'block';

        }


        const registerForm =
            document.getElementById('registerForm');


        registerForm.addEventListener('submit', async function(event) {

            event.preventDefault();

            const username =
                document.getElementById('registerUsername').value;

            const password =
                document.getElementById('registerPassword').value;

            const registerError =
                document.getElementById('registerError');

            try {

                const response = await fetch('/register', {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded'
                    },

                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })

                });

                if (response.ok) {

                    createAccountCard.style.display = 'none';

                    showAlbumPage();

                    registerError.innerText = '';

                } else if (response.status === 409) {

                    registerError.innerText =
                        'Username already exists.';

                } else {

                    registerError.innerText =
                        'Could not create account.';

                }

            } catch (error) {

                registerError.innerText =
                    'Could not connect to server.';

            }

        });


        async function logout() {

            try {

                await fetch('/logout', {

                    method: 'POST'

                });

                loginForm.reset();
                resetAlbumPage();

                dashboardCard.style.display = 'none';

                albumPage.style.display = 'none';

                loginCard.style.display = 'block';

            } catch (error) {

                errorMessage.innerText =
                    'Could not connect to server.';

            }

        }

        function showAlbumPage() {
            resetAlbumPage();
            loginCard.style.display = 'none';
            createAccountCard.style.display = 'none';
            dashboardCard.style.display = 'none';
            albumPage.style.display = 'block';
        }

        function resetAlbumPage() {
            document.getElementById('albumQuery').value = '';
            document.getElementById('searchStatus').innerText = '';
            document.getElementById('albumResults').innerHTML = '';
            albumPage.scrollTop = 0;
        }

        // Fill the popup with the selected album and reset its form controls.
        function openReviewMenu(album) {
            document.getElementById('reviewAlbumTitle').innerText = album.title;
            document.getElementById('reviewAlbumArtist').innerText = album.artist;
            document.getElementById('reviewAlbumYear').innerText = album.release_year;

            const cover = document.getElementById('reviewAlbumCover');
            const placeholder = document.getElementById('reviewCoverPlaceholder');
            
            // set cover to the album cover or a placeholder
            if (album.album_cover_url) {
                cover.src = album.album_cover_url;
                cover.alt = album.title + ' album cover';
                cover.hidden = false;
                placeholder.hidden = true;
            } else {
                cover.removeAttribute('src');
                cover.alt = '';
                cover.hidden = true;
                placeholder.hidden = false;
            }

            // get todays date
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');

            // format it to use it as the max for listenedAt date input
            const formattedToday = `${yyyy}-${mm}-${dd}`;
            document.getElementById('listenedAt').max = formattedToday;

            // reset review popup elements
            document.getElementById('listenedAt').value = '';
            document.getElementById('reviewText').value = '';
            document.getElementById('reviewHeart').setAttribute('aria-pressed', 'false');
            updateStars(0);

            // gray out the background and focus the keyboard to the close button
            document.getElementById('reviewBackdrop').hidden = false;
            document.getElementById('closeReviewButton').focus();
        }

        // Update each star's fill and remember the selected rating.
        function updateStars(rating) {
            const clearButton = document.querySelector('.clear-rating');
            clearButton.hidden = rating === 0;


            selectedRating = rating;

            document.querySelectorAll('.star-rating button').forEach(function(starButton) {
                const starNumber = Number(starButton.dataset.star);

                let fill = 0;
                if (starNumber != 0) {
                    if (rating >= starNumber) {
                        fill = 100;
                    } else if (rating >= starNumber - 0.5) {
                        fill = 50;
                    }
                }

                starButton.style.setProperty('--star-fill', fill + '%');
                starButton.setAttribute('aria-pressed', fill > 0);
            });
        }

        function closeReviewMenu() {
            document.getElementById('reviewBackdrop').hidden = true;
        }

        // Register popup interactions after its helper functions are defined.
        // Clicking a selected whole star again changes it to a half star.
        document.querySelectorAll('.star-rating button').forEach(function(starButton) {
            starButton.addEventListener('click', function() {
                const starNumber = Number(starButton.dataset.star);

                if (selectedRating === starNumber && starNumber != 0) {
                    updateStars(starNumber - 0.5);
                } else {
                    updateStars(starNumber);
                }
            });
        });

        document.getElementById('closeReviewButton').addEventListener('click', function() {
            closeReviewMenu();
        });

        document.getElementById('saveReviewButton').addEventListener('click', function() {
            // need to implement the save the review data functionality
            closeReviewMenu();
        });

        document.getElementById('reviewBackdrop').addEventListener('click', function(event) {
            if (event.target === document.getElementById('reviewBackdrop')) {
                closeReviewMenu();
            }
        });

        document.getElementById('reviewHeart').addEventListener('click', function() {
            const heart = document.getElementById('reviewHeart');
            const isPressed = heart.getAttribute('aria-pressed') === 'true';

            heart.setAttribute('aria-pressed', !isPressed);
        });

        document.addEventListener('keydown', function(event) {
            const backdrop = document.getElementById('reviewBackdrop');

            if (event.key === 'Escape' && !backdrop.hidden) {
                closeReviewMenu();
            }
        });

        document.getElementById('albumSearchForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const query = document.getElementById('albumQuery').value.trim();
            const searchStatus = document.getElementById('searchStatus');
            const albumResults = document.getElementById('albumResults');
            searchStatus.innerText = 'Searching...';
            albumResults.innerHTML = '';

            try {
                const response = await fetch('/api/albums?q=' + encodeURIComponent(query));
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Search failed');
                }

                searchStatus.innerText = data.albums.length
                    ? 'Search results:'
                    : 'No albums found.';

                data.albums.forEach(function(album) {
                    const result = document.createElement('article');
                    result.className = 'album-result';

                    const cover = album.album_cover_url
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (album.album_cover_url) {
                        cover.src = album.album_cover_url;
                        cover.alt = album.title + ' album cover';
                    } else {
                        cover.className = 'album-cover-placeholder';
                    }

                    const details = document.createElement('div');
                    const title = document.createElement('h3');
                    title.innerText = album.title;
                    const artist = document.createElement('p');
                    artist.innerText = album.artist;
                    const year = document.createElement('p');
                    year.innerText = album.release_year;
                    details.append(title, artist, year);

                    if (album.spotify_url) {
                        const link = document.createElement('a');
                        link.href = album.spotify_url;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.innerText = 'Open in Spotify';
                        details.appendChild(link);
                    }

                    const reviewButton = document.createElement('button');

                    reviewButton.innerText = 'Write a review';

                    reviewButton.type = 'button';

                    reviewButton.addEventListener('click', function() {
                        openReviewMenu(album);
                    });

                    details.appendChild(reviewButton);

                    result.append(cover, details);
                    albumResults.appendChild(result);
                });
            } catch (error) {
                searchStatus.innerText = error.message === 'Spotify search is unavailable'
                    ? 'Spotify search is unavailable. Check the server credentials.'
                    : error.message;
            }
        });

    </script>

</body>

</html>
