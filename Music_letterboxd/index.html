
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Login Page</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #764ba2;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a377d;
        }

        .error-message {
            color: #de3e3e;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        .success-box {
            display: none;
        }

        .create-account {
            margin-top: 15px;
        }

        .create-account button {
            background: none;
            border: none;
            color: #764ba2;
            cursor: pointer;
            font-size: 14px;
        }

        .album-page {
            display: none;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            padding: 40px 24px;
            background: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .album-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .album-search,
        #albumResults {
            width: 100%;
        }

        .album-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .album-header h1 {
            margin: 0;
            color: #333;
            font-size: 28px;
        }

        .album-header button {
            border: none;
            color: #764ba2;
            background: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .album-search {
            padding: 28px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
        }

        .album-search h2 {
            margin-top: 0;
            color: #333;
        }

        .album-search form {
            display: flex;
            gap: 10px;
        }

        .album-search input {
            flex: 1;
        }

        .album-search .btn {
            width: auto;
            white-space: nowrap;
        }

        #searchStatus {
            min-height: 20px;
            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }

        #albumResults {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .album-result {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 6px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .album-result img,
        .album-cover-placeholder {
            width: 80px;
            height: 80px;
            flex: 0 0 80px;
            object-fit: cover;
            background: #ddd;
        }

        .album-result h3 { margin: 0 0 6px; color: #333; font-size: 16px; }
        .album-result p { margin: 3px 0; color: #666; font-size: 14px; }
        .album-result a { color: #764ba2; font-size: 13px; }

        @media (max-width: 600px) {
            .album-header { align-items: flex-start; gap: 16px; }
            .album-search form { flex-direction: column; }
            .album-search .btn { width: 100%; }
        }

    </style>

</head>

<body>

    <div class="login-card" id="loginCard">

        <h2>Sign In</h2>

        <form id="loginForm">

            <div class="input-group">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="btn">Login</button>

        </form>

        <div class="create-account">

            <button onclick="showCreateAccount()">
                Create Account
            </button>

        </div>

        <div class="error-message" id="errorMessage"></div>

    </div>


    <div
        class="login-card"
        id="createAccountCard"
        style="display: none;"
    >

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="input-group">

                <label for="registerUsername">Username</label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <div class="create-account">

            <button onclick="showLogin()">
                Back to Login
            </button>

        </div>

        <div class="error-message" id="registerError"></div>

    </div>


    <div class="login-card success-box" id="dashboardCard">

        <h2>Welcome Back!</h2>

        <p>You have successfully logged in.</p>

        <button class="btn" onclick="logout()">Logout</button>

    </div>


    <div class="album-page" id="albumPage">

        <div class="album-container">
            <div class="album-header">
                <h1>Music Letterboxd</h1>
                <button type="button" onclick="logout()">Logout</button>
            </div>

            <div class="album-search">
                <h2>Search for an album</h2>

                <form id="albumSearchForm">
                    <input
                        type="search"
                        id="albumQuery"
                        placeholder="Enter an album or artist"
                        required
                    >
                    <button type="submit" class="btn">Search</button>
                </form>

                <div id="searchStatus"></div>
            </div>

            <div id="albumResults"></div>
        </div>

    </div>


    <script>

        const loginForm = document.getElementById('loginForm');

        const errorMessage = document.getElementById('errorMessage');

        const loginCard = document.getElementById('loginCard');

        const dashboardCard =
            document.getElementById('dashboardCard');

        const albumPage =
            document.getElementById('albumPage');

        const createAccountCard =
            document.getElementById('createAccountCard');


        loginForm.addEventListener('submit', async function(event) {

            event.preventDefault();

            const username =
                document.getElementById('username').value;

            const password =
                document.getElementById('password').value;

            try {

                const response = await fetch('/login', {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded'
                    },

                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })

                });

                if (response.ok) {

                    errorMessage.innerText = '';

                    loginCard.style.display = 'none';

                    showAlbumPage();

                } else {

                    errorMessage.innerText =
                        'Invalid username or password!';

                }

            } catch (error) {

                errorMessage.innerText =
                    'Could not connect to server.';

            }

        });


        function showCreateAccount() {

            loginCard.style.display = 'none';

            createAccountCard.style.display = 'block';

        }


        function showLogin() {

            createAccountCard.style.display = 'none';

            loginCard.style.display = 'block';

        }


        const registerForm =
            document.getElementById('registerForm');


        registerForm.addEventListener('submit', async function(event) {

            event.preventDefault();

            const username =
                document.getElementById('registerUsername').value;

            const password =
                document.getElementById('registerPassword').value;

            const registerError =
                document.getElementById('registerError');

            try {

                const response = await fetch('/register', {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/x-www-form-urlencoded'
                    },

                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })

                });

                if (response.ok) {

                    createAccountCard.style.display = 'none';

                    showAlbumPage();

                    registerError.innerText = '';

                } else if (response.status === 409) {

                    registerError.innerText =
                        'Username already exists.';

                } else {

                    registerError.innerText =
                        'Could not create account.';

                }

            } catch (error) {

                registerError.innerText =
                    'Could not connect to server.';

            }

        });


        async function logout() {

            try {

                await fetch('/logout', {

                    method: 'POST'

                });

                loginForm.reset();
                resetAlbumPage();

                dashboardCard.style.display = 'none';

                albumPage.style.display = 'none';

                loginCard.style.display = 'block';

            } catch (error) {

                errorMessage.innerText =
                    'Could not connect to server.';

            }

        }

        function showAlbumPage() {
            resetAlbumPage();
            loginCard.style.display = 'none';
            createAccountCard.style.display = 'none';
            dashboardCard.style.display = 'none';
            albumPage.style.display = 'block';
        }

        function resetAlbumPage() {
            document.getElementById('albumQuery').value = '';
            document.getElementById('searchStatus').innerText = '';
            document.getElementById('albumResults').innerHTML = '';
            albumPage.scrollTop = 0;
        }

        document.getElementById('albumSearchForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const query = document.getElementById('albumQuery').value.trim();
            const searchStatus = document.getElementById('searchStatus');
            const albumResults = document.getElementById('albumResults');
            searchStatus.innerText = 'Searching...';
            albumResults.innerHTML = '';

            try {
                const response = await fetch('/api/albums?q=' + encodeURIComponent(query));
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Search failed');
                }

                searchStatus.innerText = data.albums.length
                    ? 'Search results:'
                    : 'No albums found.';

                data.albums.forEach(function(album) {
                    const result = document.createElement('article');
                    result.className = 'album-result';

                    const cover = album.album_cover_url
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (album.album_cover_url) {
                        cover.src = album.album_cover_url;
                        cover.alt = album.title + ' album cover';
                    } else {
                        cover.className = 'album-cover-placeholder';
                    }

                    const details = document.createElement('div');
                    const title = document.createElement('h3');
                    title.innerText = album.title;
                    const artist = document.createElement('p');
                    artist.innerText = album.artist;
                    const year = document.createElement('p');
                    year.innerText = album.release_year;
                    details.append(title, artist, year);

                    if (album.spotify_url) {
                        const link = document.createElement('a');
                        link.href = album.spotify_url;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.innerText = 'Open in Spotify';
                        details.appendChild(link);
                    }

                    result.append(cover, details);
                    albumResults.appendChild(result);
                });
            } catch (error) {
                searchStatus.innerText = error.message === 'Spotify search is unavailable'
                    ? 'Spotify search is unavailable. Check the server credentials.'
                    : error.message;
            }
        });

    </script>

</body>

</html>
